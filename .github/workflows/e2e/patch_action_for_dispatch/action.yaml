name: Patch deploy-action for manual dispatch
description: >
  On workflow_dispatch the deploy-action's Get Deploy Type and Get DBT Deploy
  Options steps early-exit because the github.event.before/after values are
  empty, bypassing the diff-based deploy-type inference that the per-job git
  mocks rely on. This composite patches the on-disk copy of the root
  action.yaml to read the DEPLOY_ACTION_DIFF_BEFORE / DEPLOY_ACTION_DIFF_AFTER
  env vars (set at the workflow level in tests.yaml) instead, so the existing
  mocks drive the deploy-type decision the same way they do on push. The
  action.yaml committed to git is unchanged.

runs:
  using: composite
  steps:
    - name: Rewrite GITHUB_EVENT_BEFORE/AFTER assignments in action.yaml
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        sed -i -E \
          -e 's|^([[:space:]]*)GITHUB_EVENT_BEFORE=.*$|\1GITHUB_EVENT_BEFORE=${DEPLOY_ACTION_DIFF_BEFORE:-}|' \
          -e 's|^([[:space:]]*)GITHUB_EVENT_AFTER=.*$|\1GITHUB_EVENT_AFTER=${DEPLOY_ACTION_DIFF_AFTER:-}|' \
          action.yaml
