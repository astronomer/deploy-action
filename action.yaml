name: "Deploy Apache Airflow DAGs to Astro"
description: "Test your DAGs and deploy your Astro project to a Deployment on Astro, Astronomer's managed Airflow service."
author: "Astronomer"
branding:
  icon: "upload-cloud"
  color: "purple"
inputs:
  root-folder:
    required: false
    default: ""
    description: "Path to the Astro project, or to the bundle directory for `dbt` and `non-dags` deploys. Required with `deploy-type: non-dags`."
  parse:
    required: false
    default: false
    description: "If true DAGs will be parsed before deploying to Astro."
  pytest:
    required: false
    default: false
    description: "if true custom pytests will be ran before deploying to Astro."
  pytest-file:
    required: false
    default: tests/
    description: "Specify custom pytest files to run with the pytest command."
  force:
    required: false
    default: false
    description: "If true your code will be force deployed to Astronomer. Mostly used to skip parse test on image deploys."
  image-name:
    required: false
    default: no-custom-image
    description: "Specify a custom built image to deploy to an Astro Deployment. To be used with 'deploy-type' set to 'image-and-dags', 'infer', or 'image-only', and not with 'parse', 'pytest', or 'build-secrets', since the image is deployed as it was built."
  action:
    required: false
    default: deploy
    description: "Specify what action you would like to take. Use this option to create or delete deployment previews. Specify either 'deploy', 'create-deployment-preview', 'delete-deployment-preview', or 'deploy-deployment-preview'. If using 'deploy' or 'deploy-deployment-preview' one should also specify 'deploy-type'."
  deployment-name:
    required: false
    description: "The name of the Deployment you want to make preview from or are deploying to."
  deployment-id:
    required: false
    description: "The id of the Deployment you to make a preview from or are deploying to."
  workspace:
    required: false
    description: "Workspace id to select. Only required when `ASTRO_API_TOKEN` is given an organization token."
  preview-name:
    required: false
    description: "Custom preview name. By default this is <branch-name>_<deployment-name>."
  copy-connections:
    required: false
    default: true
    description: "Copy connections from the original Deployment to the new deployment preview."
  copy-airflow-variables:
    required: false
    default: true
    description: "Copy Airflow variables from the original Deployment to the new deployment preview."
  copy-pools:
    required: false
    default: true
    description: "Copy pools from the original Deployment to the new deployment preview."
  cli-version:
    required: false
    default: "1.46.1"
    description: "The desired Astro CLI version to use. Pinned so a given ref of this action always installs the same CLI."
  checkout:
    required: false
    default: true
    description: "Whether to checkout the repo as the first step. Set this to false if you want to modify repo contents before invoking the action"
  description:
    required: false
    description: >
      A description to set for deploying to Astro. This is equivalent to running `astro deploy --description "..."` with the Astro CLI.
      The description is visible in the Deploy History tab in your Astro Deployment, and can be helpful to explain what triggered a deploy.

      For example, to display the most recent commit that resulted in an Astro deploy, you could configure
      `description: "Deployed from commit ..."` with the value of `github.event.after`.
      This would display e.g. "Deployed from commit da39a3ee5e6b4b0d3255bfef95601890afd80709".
      Reference: https://docs.github.com/en/webhooks/webhook-events-and-payloads#push.
  deploy-image:
    required: false
    default: false
    description: "If true image and DAGs will deploy. NOTE: This option is deprecated and will be removed in a future release. Use `deploy-type: image-and-dags` instead."
  deploy-type:
    required: false
    default: "infer"
    description: "Specify the type of deploy you would like to do. Use this option to deploy only DAGs or the image, a DBT project, or a non-DAG bundle. Specify either 'infer', 'dags-only', 'image-and-dags', 'image-only', 'dbt', or 'non-dags'. 'infer' option would infer between DAG only deploy and image and DAG deploy based on updated files. 'image-only' deploys the image without updating DAGs. 'non-dags' deploys the 'root-folder' directory as a non-DAG bundle mounted at 'mount-path', and requires Astro CLI 1.44.0 or higher."
  image-trigger-paths:
    required: false
    default: ""
    description: >
      Comma- or newline-separated list of paths outside `root-folder` that should also trigger a deploy when changed.
      Useful in monorepos where files built or copied into the image at deploy time (e.g. generated protos) live outside
      the Astro project. A change under any of these paths forces an image deploy instead of being skipped. Paths are
      matched as prefixes against repo-root-relative file paths, so include a trailing slash to scope to a directory
      (e.g. `proto/`). Only applies to the `infer`, `image-and-dags`, and `image-only` deploy types. For `dbt` and
      `non-dags` deploys, use `bundle-trigger-paths` instead.
  skip-unchanged:
    required: false
    default: true
    description: >
      When true (default), the action skips the deploy if no changed files fall under `root-folder` or `dags-path` (or
      `image-trigger-paths` / `bundle-trigger-paths`). Set to false to disable this diff-based skip and always run the deploy dictated by
      `deploy-type` on every run. This is the closest replacement for the deprecated `deploy-image: true` behavior.
  build-secrets:
    required: false
    description: >
      Newline-delimited list of Docker build secrets, one `docker build --secret` specification per line, e.g.
      'id=mysecret,src=secrets.txt'. Each line is passed to `astro deploy` as its own `--build-secret` flag.
      See https://docs.docker.com/build/building/secrets/ for more information.
  mount-path:
    required: false
    default: ""
    description: >
      Path to mount the bundle in Airflow, for reference by DAGs. Required with `deploy-type: non-dags`. With
      `deploy-type: dbt` it is optional and defaults to /usr/local/airflow/dbt/{dbt project name}.
  non-dags-bundle-type:
    required: false
    default: ""
    description: >
      Free-form label identifying the kind of non-DAG bundle being deployed (e.g. `dbt`), shown in the Deploy History
      tab. Only applies to the `non-dags` deploy type. Requires Astro CLI 1.44.0 or higher.
  bundle-trigger-paths:
    required: false
    default: ""
    description: >
      Comma- or newline-separated list of paths outside `root-folder` that should also trigger a bundle deploy when changed. Useful in monorepos where a bundle depends on shared files that live outside its own directory. Paths are
      matched as prefixes against repo-root-relative file paths, so include a trailing slash to scope to a directory
      (e.g. `shared/macros/`). Only applies to the `dbt` and `non-dags` deploy types.
  dag-bundle-name:
    required: false
    default: ""
    description: >
      Deploy DAGs to a named DAG bundle on the Deployment instead of the default bundle. Requires Airflow 3, and the
      bundle must already exist on the Deployment; `create-deployment-preview` copies the original Deployment's bundles
      to the preview. Use with `deploy-type: dags-only` or `image-and-dags`. Requires Astro CLI 1.44.0 or higher.
  dags-path:
    required: false
    default: ""
    description: >
      Deploy DAGs from this path, relative to `root-folder`, instead of the project's `dags` directory. Useful for
      serving several DAG bundles out of one repository, one action invocation per bundle. A `dags-only` deploy
      classifies changes against this path instead of `dags/`, and with Astro CLI 1.45.0 or higher (and `parse` and
      `pytest` off) it needs no Astro project, so `root-folder` can be left empty. Use with `deploy-type: dags-only` or
      `image-and-dags`.
  no-dags-base-dir:
    required: false
    default: false
    description: >
      If true, exclude the DAGs directory prefix from the uploaded bundle. Use for Airflow 3 Deployments, where the
      bundle root is already on sys.path. Use with `deploy-type: infer`, `dags-only`, or `image-and-dags`, and not with
      `image-name`.
  checkout-submodules:
    required: false
    default: false
    description: "Whether to checkout submodules when cloning the repository: `false` to disable (default), `true` to checkout submodules or `recursive` to recursively checkout submodules. Works only when `checkout` is set to `true`."
  sparse-checkout:
    required: false
    default: ""
    description: >
      Comma- or newline-separated list of cone-mode sparse-checkout patterns passed to actions/checkout.
      When set, only the listed paths (plus repo-root files) are checked out, which can reduce checkout size for monorepos.
      Works only when `checkout` is set to `true`. Leave empty for a full checkout (default).
  wake-on-deploy:
    required: false
    default: false
    description: "If true, the deployment will be woken up from hibernation before deploying. NOTE: This option overrides the deployment's hibernation override spec."
  wait-time:
    required: false
    description: "The time to wait for the deployment or deploy operation to finish successfully."
outputs:
  preview-id:
    description: "The ID of the created deployment preview. Only works when action=create-deployment-preview"
    value: ${{ steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID }}

runs:
  using: "composite"
  steps:
    - name: checkout repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: inputs.checkout == 'true'
      with:
        fetch-depth: 0  # Fetch all history
        ref: ${{ github.event.after }}
        clean: false
        persist-credentials: false
        submodules: ${{ inputs.checkout-submodules }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
    - name: Warn about deprecated deploy-image option
      if: inputs.deploy-image == true
      shell: bash
      run: |
        echo "The 'deploy-image' option is deprecated and will be removed in 1.0 release. Use 'deploy-type: image-and-dags' instead."
    - name: Install Astro CLI
      run: |

        echo ::group::Install Astro CLI
        CLI_VERSION=${{ inputs.cli-version }}
        # if Astro CLI is pre-installed, fetch it's version
        if command -v astro &> /dev/null; then
          # "astro version" commands returns the CLI version, its output is of the form: "Astro CLI Version: 1.29.0"
          CLI_VERSION=$(astro version | awk '{print $4}')
        fi

        # Ensure semver CLI is available for version comparisons. The version is
        # pinned and install scripts are off, so a run cannot pull unreviewed code.
        if ! command -v semver &> /dev/null; then
          npm install -g --ignore-scripts semver@7.8.5
        fi

        # Check if the Astro CLI version is less than 1.28.1 for dbt-deploy
        if [[ "${{ inputs.deploy-type }}" == "dbt" && $CLI_VERSION != "" ]]; then
          REQUIRED_VERSION="1.28.1"
          CURRENT_VERSION="${CLI_VERSION}"
          if ! semver -r ">${REQUIRED_VERSION}" "${CURRENT_VERSION}"; then
            echo "DBT Deploy requires Astro CLI version $REQUIRED_VERSION or higher"
            exit 1
          fi
        fi

        # Check if the Astro CLI version is less than 1.21.0 for image-only deploy
        if [[ "${{ inputs.deploy-type }}" == "image-only" && $CLI_VERSION != "" ]]; then
          REQUIRED_VERSION="1.21.0"
          CURRENT_VERSION="${CLI_VERSION}"
          if ! semver -r ">=${REQUIRED_VERSION}" "${CURRENT_VERSION}"; then
            echo "Image-only deploy requires Astro CLI version $REQUIRED_VERSION or higher"
            exit 1
          fi
        fi

        # Check if the Astro CLI version is less than 1.38.0 for wait-time option
        if [[ "${{ inputs.wait-time }}" != "" && $CLI_VERSION != "" ]]; then
          REQUIRED_VERSION="1.38.0"
          if ! semver -r ">=${REQUIRED_VERSION}" "${CLI_VERSION}"; then
            echo "Wait time option requires Astro CLI version $REQUIRED_VERSION or higher"
            exit 1
          fi
        fi

        # Check if the Astro CLI version is less than 1.44.0 for non-DAG bundle deploys
        if [[ "${{ inputs.deploy-type }}" == "non-dags" && $CLI_VERSION != "" ]]; then
          REQUIRED_VERSION="1.44.0"
          if ! semver -r ">=${REQUIRED_VERSION}" "${CLI_VERSION}"; then
            echo "Non-DAG bundle deploys require Astro CLI version $REQUIRED_VERSION or higher"
            exit 1
          fi
        fi

        # Check if the Astro CLI version is less than 1.44.0 for named DAG bundles
        if [[ "$DAG_BUNDLE_NAME" != "" && $CLI_VERSION != "" ]]; then
          REQUIRED_VERSION="1.44.0"
          if ! semver -r ">=${REQUIRED_VERSION}" "${CLI_VERSION}"; then
            echo "The dag-bundle-name option requires Astro CLI version $REQUIRED_VERSION or higher"
            exit 1
          fi
        fi

        # skip Astro CLI installation if already installed
        if command -v astro &> /dev/null; then
          echo "Astro CLI is already installed"
          exit 0
        fi

        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

        # check if CLI_VERSION does not starts with "v", then add "v" to it
        if [[ $CLI_VERSION != "" && $CLI_VERSION != v* ]]; then
          CLI_VERSION=v$CLI_VERSION
        fi

        # The installer script is pinned to an astro-cli commit instead of main, so
        # a run cannot execute unreviewed code. A commit and not a tag: tags can be moved,
        # and astro-cli cuts a release tag before the commit that bumps LATEST_VERSION here.
        # The version installed comes from the cli-version input, not from this script.
        GODOWNLOADER_URL="https://raw.githubusercontent.com/astronomer/astro-cli/0dfc4bff5cbbf014ce092abf3a421ca41781cabe/godownloader.sh"

        if [[ $CLI_VERSION == "" ]]; then
          curl -sSL "$GODOWNLOADER_URL" | bash -s -- -b "$HOME/.local/bin"
        else
          curl -sSL "$GODOWNLOADER_URL" | bash -s -- -b "$HOME/.local/bin" "$CLI_VERSION"
        fi
        echo ::endgroup::
      shell: bash
      env:
        DAG_BUNDLE_NAME: ${{ inputs.dag-bundle-name }}
    - name: Determine Deploy Deployment
      run: |

        echo ::group::Determine Deploy Deployment

        # validate action input
        if [[ ${{ inputs.action }} != create-deployment-preview && ${{ inputs.action }} != delete-deployment-preview && ${{ inputs.action }} != deploy-deployment-preview && ${{ inputs.action }} != deploy ]]; then
          echo ERROR: you specified an improper action input. Action must be deploy, deploy-deployment-preview, create-deployment-preview, or delete-deployment-preview.
          exit 1 # terminate and indicate error
        fi

        # inputs that only shape a deploy aren't validated for a delete, which deploys nothing, so a delete
        # step that shares a deploy step's inputs still removes the preview
        if [[ ${{ inputs.action }} != delete-deployment-preview ]]; then
          # validate deploy-type input
          case "${{ inputs.deploy-type }}" in
            infer|dags-only|image-and-dags|image-only|dbt|non-dags) ;;
            *)
              echo "ERROR: you specified an improper deploy-type input. Deploy type must be infer, dags-only, image-and-dags, image-only, dbt, or non-dags."
              exit 1 # terminate and indicate error
              ;;
          esac

          # validate deploy-type-specific inputs
          # a custom image is deployed as it was built, so there is nothing to test or build, and dags-only never
          # deploys an image; the CLI rejects the equivalent flags alongside --image-name
          if [[ "${{ inputs.image-name }}" != "no-custom-image" ]]; then
            if [[ "${{ inputs.deploy-type }}" == "dags-only" ]]; then
              echo "ERROR: image-name is only supported with deploy-type infer, image-and-dags, or image-only"
              exit 1 # terminate and indicate error
            fi
            # image-only deploys don't pass parse or pytest on
            if [[ ( "${{ inputs.deploy-type }}" == "infer" || "${{ inputs.deploy-type }}" == "image-and-dags" ) && ( "${{ inputs.parse }}" == "true" || "${{ inputs.pytest }}" == "true" ) ]]; then
              echo "ERROR: parse and pytest cannot be used with image-name"
              exit 1 # terminate and indicate error
            fi
            if [[ -n "$BUILD_SECRETS" && "${{ inputs.deploy-type }}" != "dbt" && "${{ inputs.deploy-type }}" != "non-dags" ]]; then
              echo "ERROR: build-secrets cannot be used with image-name"
              exit 1 # terminate and indicate error
            fi
          fi
          # image-trigger-paths only affects image deploys, so it's a no-op for the DAG and bundle deploy types
          if [[ -n "${{ inputs.image-trigger-paths }}" && ( "${{ inputs.deploy-type }}" == "dags-only" || "${{ inputs.deploy-type }}" == "dbt" || "${{ inputs.deploy-type }}" == "non-dags" ) ]]; then
            echo "ERROR: image-trigger-paths is only supported with deploy-type infer, image-and-dags, or image-only"
            exit 1 # terminate and indicate error
          fi
          # bundle-trigger-paths is the bundle-deploy equivalent of image-trigger-paths
          if [[ -n "$BUNDLE_TRIGGER_PATHS" && "${{ inputs.deploy-type }}" != "dbt" && "${{ inputs.deploy-type }}" != "non-dags" ]]; then
            echo "ERROR: bundle-trigger-paths is only supported with deploy-type dbt or non-dags"
            exit 1 # terminate and indicate error
          fi

          # non-DAG bundles are mounted at a path, which the CLI cannot infer
          if [[ "${{ inputs.deploy-type }}" == "non-dags" && -z "$MOUNT_PATH" ]]; then
            echo "ERROR: mount-path is required with deploy-type non-dags"
            exit 1 # terminate and indicate error
          fi
          # mount-path and non-dags-bundle-type only mean anything for a bundle deploy; a stray mount-path is
          # tolerated so workflows passing it to every invocation keep working
          if [[ -n "$MOUNT_PATH" && "${{ inputs.deploy-type }}" != "dbt" && "${{ inputs.deploy-type }}" != "non-dags" ]]; then
            echo "::warning::mount-path is ignored unless deploy-type is dbt or non-dags"
          fi
          if [[ -n "$NON_DAGS_BUNDLE_TYPE" && "${{ inputs.deploy-type }}" != "non-dags" ]]; then
            echo "ERROR: non-dags-bundle-type is only supported with deploy-type non-dags"
            exit 1 # terminate and indicate error
          fi
          # a non-DAG bundle deploy builds and tests nothing; the CLI rejects the equivalent flags alongside --non-dags
          if [[ "${{ inputs.deploy-type }}" == "non-dags" && ( "${{ inputs.image-name }}" != "no-custom-image" || "${{ inputs.parse }}" == "true" || "${{ inputs.pytest }}" == "true" || -n "$BUILD_SECRETS" ) ]]; then
            echo "ERROR: image-name, parse, pytest, and build-secrets are not supported with deploy-type non-dags"
            exit 1 # terminate and indicate error
          fi

          # a non-DAG bundle is deployed from root-folder; left empty, the whole repository would be deployed as the bundle
          if [[ "${{ inputs.deploy-type }}" == "non-dags" && -z "$ROOT_FOLDER" ]]; then
            echo "ERROR: root-folder is required with deploy-type non-dags"
            exit 1 # terminate and indicate error
          fi

          # the DAG options below only apply to deploys that carry DAGs
          for dag_option in "dag-bundle-name:$DAG_BUNDLE_NAME" "dags-path:$DAGS_PATH" "no-dags-base-dir:$NO_DAGS_BASE_DIR"; do
            option_name="${dag_option%%:*}"
            option_value="${dag_option#*:}"
            if [[ -z "$option_value" || "$option_value" == "false" ]]; then
              continue
            fi
            if [[ "${{ inputs.deploy-type }}" == "image-only" || "${{ inputs.deploy-type }}" == "dbt" || "${{ inputs.deploy-type }}" == "non-dags" ]]; then
              echo "ERROR: $option_name is only supported with deploy-type infer, dags-only, or image-and-dags"
              exit 1 # terminate and indicate error
            fi
            # the CLI rejects these options alongside a pre-built image, which carries its own DAGs
            if [[ "${{ inputs.image-name }}" != "no-custom-image" ]]; then
              echo "ERROR: $option_name cannot be used with image-name"
              exit 1 # terminate and indicate error
            fi
          done
          # a step deploying one bundle must never fall back to building the project's image, which infer
          # does for any change it doesn't classify as a DAG
          if [[ ( -n "$DAG_BUNDLE_NAME" || -n "$DAGS_PATH" ) && "${{ inputs.deploy-type }}" == "infer" ]]; then
            echo "ERROR: dag-bundle-name and dags-path cannot be used with deploy-type infer (the default); set deploy-type to dags-only, or image-and-dags to also deploy the image"
            exit 1 # terminate and indicate error
          fi

          # dags-path is resolved from root-folder, the CLI's working directory; changes are matched against
          # its repo-relative form, so DAGs outside the Astro project are still picked up
          DAGS_DIR=""
          if [[ -n "$DAGS_PATH" ]]; then
            if ! dags_abs=$(cd "${ROOT_FOLDER:-.}" 2> /dev/null && cd "$DAGS_PATH" 2> /dev/null && pwd); then
              echo "ERROR: dags-path '$DAGS_PATH' is not a directory"
              exit 1 # terminate and indicate error
            fi
            if [[ $dags_abs != "$PWD" && $dags_abs != "$PWD"/* ]]; then
              echo "ERROR: dags-path must resolve to a directory inside the repository"
              exit 1 # terminate and indicate error
            fi
            DAGS_DIR=${dags_abs#"$PWD"}
            DAGS_DIR=${DAGS_DIR#/}
          fi
          echo "DAGS_DIR=$DAGS_DIR" >> $GITHUB_OUTPUT
        fi

        # Select workspace if specified
        if [[ "${{ inputs.workspace }}" != "" ]]; then
          astro workspace switch ${{ inputs.workspace }}
        fi
        # error if both deployment name and id are used
        if [[ "${{ inputs.deployment-name }}" != "" && "${{ inputs.deployment-id }}" != "" ]]; then
          echo ERROR: cannot specify both a Deployment ID and Name
          exit 1 # terminate and indicate error
        fi
        # figure out deployment id
        if [[ "${{ inputs.deployment-name }}" != "" ]]; then
          # get deployment-id
          DEPLOYMENT_ID="$(astro deployment inspect --clean-output -n "${{ inputs.deployment-name }}" --key metadata.deployment_id)"
        fi

        if [[ "${{ inputs.deployment-id }}" != "" ]]; then
          DEPLOYMENT_ID="${{ inputs.deployment-id }}"
        fi
        # create deployment preview if action is create-deployment-preview
        if [[ ${{ inputs.action }} == create-deployment-preview ]]; then

          if [[ "${{ inputs.deployment-name }}" == "" && "${{ inputs.deployment-id }}" == "" ]]; then
            echo ERROR: cannot create a deployment preview without specifying a deployment name or id
            exit 1 # terminate and indicate error
          fi

          if [[ "${{ inputs.preview-name }}" != "" ]]; then
            BRANCH_DEPLOYMENT_NAME="${{ inputs.preview-name }}"
          else
            # get branch name
            DEPLOYMENT_NAME="$(astro deployment inspect $DEPLOYMENT_ID --clean-output --key configuration.name)"
            if [[ ${GITHUB_HEAD_REF##*/} != "" ]]; then
              BRANCH_DEPLOYMENT_NAME=${GITHUB_HEAD_REF##*/}_$DEPLOYMENT_NAME
            else
              branch_ref="${{ github.ref }}"
              branch_name="${branch_ref##*/}"
              BRANCH_DEPLOYMENT_NAME=${branch_name}_$DEPLOYMENT_NAME
            fi
            BRANCH_DEPLOYMENT_NAME="${BRANCH_DEPLOYMENT_NAME// /_}"
            echo $BRANCH_DEPLOYMENT_NAME
          fi

          # Create template of deployment to be copied with
          astro deployment inspect $DEPLOYMENT_ID --clean-output --template > deployment-preview-template.yaml # automatically creates deployment-preview-template.yaml file

          # Add name to deployment template file
          sed -i "s|  name:.*|  name: ${BRANCH_DEPLOYMENT_NAME}|g"  deployment-preview-template.yaml

          # Decide whether deployment create can run with --wait based on CLI version
          CLI_VERSION=$(astro version | awk '{print $4}')
          REQUIRED_WAIT_VERSION="1.37.0"

          if command -v semver >/dev/null 2>&1 && [[ -n "$CLI_VERSION" ]] && semver -r ">=${REQUIRED_WAIT_VERSION}" "$CLI_VERSION" >/dev/null 2>&1; then
            if [[ "${{ inputs.wait-time }}" != "" ]]; then
              astro deployment create --wait --deployment-file deployment-preview-template.yaml --wait-time "${{ inputs.wait-time }}"
            else
              astro deployment create --wait --deployment-file deployment-preview-template.yaml
            fi
          else
            if ! command -v semver >/dev/null 2>&1; then
              echo "semver CLI not available; continuing without deployment create --wait"
            elif [[ -z "$CLI_VERSION" ]]; then
              echo "Unable to determine Astro CLI version; continuing without deployment create --wait"
            else
              echo "Astro CLI $CLI_VERSION does not support deployment create --wait; continuing without it"
            fi
            astro deployment create --deployment-file deployment-preview-template.yaml
          fi

          PREVIEW_ID=$(astro deployment inspect --clean-output -n $BRANCH_DEPLOYMENT_NAME --key metadata.deployment_id)

          # The template carries no bundles, so recreate the original Deployment's on the preview: DAG bundles
          # by name, since a deploy into a named bundle needs it to exist, then non-DAG bundles, linked to the
          # preview's DAG bundles of the same names. Only the bundles are copied; the preview's deploys fill them.
          if [[ -z "$CLI_VERSION" ]] || ! command -v semver >/dev/null 2>&1 || ! semver -r ">=1.44.0" "$CLI_VERSION" >/dev/null 2>&1; then
            echo "::notice::Astro CLI ${CLI_VERSION:-(unknown version)} has no bundle commands (added in 1.44.0), so bundles on the original Deployment were not copied to the preview"
          elif ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not installed, so bundles on the original Deployment were not copied to the preview"
          else
            # with ASTRO_API_TOKEN set, the CLI prints "Using an Astro API Token" to stdout ahead of the JSON
            list_bundles() {
              astro deployment bundle list --deployment-id "$1" --json | jq -Rsc 'sub("^[^{]*"; "") | fromjson | .bundles // []'
            }
            SOURCE_BUNDLES=$(list_bundles "$DEPLOYMENT_ID" | jq -c 'map(select(.deletionIsPending != true))')

            # DAG bundles the preview lacks, by name
            PREVIEW_BUNDLES=$(list_bundles "$PREVIEW_ID")
            MISSING_DAG_BUNDLES=$(jq -r --argjson preview "$PREVIEW_BUNDLES" '
              ($preview | map(select(.isDagBundle == true) | .name)) as $existing
              | .[]
              | select(.isDagBundle == true and (.name // "") != "" and (.name | IN($existing[]) | not))
              | .name
            ' <<< "$SOURCE_BUNDLES")
            while IFS= read -r name; do
              if [[ -n $name ]]; then
                echo "Copying DAG bundle '$name' to the preview"
                astro deployment bundle create --deployment-id "$PREVIEW_ID" --name "$name"
              fi
            done <<< "$MISSING_DAG_BUNDLES"

            # non-DAG bundles the preview lacks, by mount path, each linked to the preview's copies of the
            # DAG bundles it is linked to on the original
            PREVIEW_BUNDLES=$(list_bundles "$PREVIEW_ID")
            MISSING_NON_DAG_BUNDLES=$(jq -c --argjson preview "$PREVIEW_BUNDLES" '
              (map(select(.isDagBundle == true) | {key: .id, value: (.name // "")}) | from_entries) as $source_dag_names
              | ($preview | map(select(.isDagBundle == true and .name != null) | {key: .name, value: .id}) | from_entries) as $preview_dag_ids
              | ($preview | map(select(.isDagBundle != true) | .nonDagMountPath)) as $existing
              | .[]
              | select(.isDagBundle != true and (.nonDagMountPath // "") != "" and (.nonDagMountPath | IN($existing[]) | not))
              | {
                  mount_path: .nonDagMountPath,
                  bundle_type: (.nonDagBundleType // ""),
                  dag_bundle_ids: ([.dagBundleIds[]? | $preview_dag_ids[$source_dag_names[.] // ""] // empty] | join(","))
                }
            ' <<< "$SOURCE_BUNDLES")
            while IFS= read -r bundle; do
              if [[ -z $bundle ]]; then
                continue
              fi
              mount_path=$(jq -r .mount_path <<< "$bundle")
              bundle_type=$(jq -r .bundle_type <<< "$bundle")
              dag_bundle_ids=$(jq -r .dag_bundle_ids <<< "$bundle")
              create_args=(--deployment-id "$PREVIEW_ID" --mount-path "$mount_path")
              if [[ -n $bundle_type ]]; then
                create_args+=(--bundle-type "$bundle_type")
              fi
              if [[ -n $dag_bundle_ids ]]; then
                create_args+=(--dag-bundle-ids "$dag_bundle_ids")
              fi
              echo "Copying non-DAG bundle mounted at '$mount_path' to the preview"
              astro deployment bundle create "${create_args[@]}"
            done <<< "$MISSING_NON_DAG_BUNDLES"
          fi

          # Get final Deployment ID
          echo "FINAL_DEPLOYMENT_ID=$PREVIEW_ID" >> $GITHUB_OUTPUT

          # Get original Deployment ID
          echo "ORIGINAL_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
        fi

        # delete deployment preview and skip deploy if action is delete-deployment-preview
        if [[ ${{ inputs.action }} == delete-deployment-preview ]]; then

          if [[ "${{ inputs.deployment-name }}" == "" && "${{ inputs.deployment-id }}" == "" ]]; then
            echo ERROR: cannot delete a deployment preview without specifying a deployment name or id
            exit 1 # terminate and indicate error
          fi

          if [[ "${{ inputs.preview-name }}" != "" ]]; then
            BRANCH_DEPLOYMENT_NAME="${{ inputs.preview-name }}"
          else
            # Get deployment name from Astro if preview-name is not provided
            DEPLOYMENT_NAME="$(astro deployment inspect $DEPLOYMENT_ID --clean-output --key configuration.name)"
            # using github.event.ref to refer the actual branch getting deleted
            branch_ref="${{ github.event.ref }}"
            branch_name="${branch_ref##*/}"
            BRANCH_DEPLOYMENT_NAME=${branch_name}_$DEPLOYMENT_NAME
            BRANCH_DEPLOYMENT_NAME="${BRANCH_DEPLOYMENT_NAME// /_}"
          fi
          # delete branch deployment
          astro deployment delete -n $BRANCH_DEPLOYMENT_NAME -f
        fi

        # # deploy to deployment preview if action is deploy-deployment-preview
        if [[ ${{ inputs.action }} == deploy-deployment-preview ]]; then

          if [[ "${{ inputs.deployment-name }}" == "" && "${{ inputs.deployment-id }}" == "" ]]; then
            echo ERROR: cannot deploy to a deployment preview without specifying a deployment name or id
            exit 1 # terminate and indicate error
          fi

          if [[ "${{ inputs.preview-name }}" != "" ]]; then
            BRANCH_DEPLOYMENT_NAME="${{ inputs.preview-name }}"
          else
            DEPLOYMENT_NAME="$(astro deployment inspect $DEPLOYMENT_ID --clean-output --key configuration.name)"
            if [[ ${GITHUB_HEAD_REF##*/} != "" ]]; then
              BRANCH_DEPLOYMENT_NAME=${GITHUB_HEAD_REF##*/}_$DEPLOYMENT_NAME
            else
              # BRANCH_DEPLOYMENT_NAME=${{ github.event.ref }}_$DEPLOYMENT_NAME
              branch_ref="${{ github.ref }}"
              branch_name="${branch_ref##*/}"
              BRANCH_DEPLOYMENT_NAME=${branch_name}_$DEPLOYMENT_NAME
            fi
            BRANCH_DEPLOYMENT_NAME="${BRANCH_DEPLOYMENT_NAME// /_}"
          fi

          # Get Deployment ID
          echo "FINAL_DEPLOYMENT_ID=$(astro deployment inspect --clean-output -n $BRANCH_DEPLOYMENT_NAME --key metadata.deployment_id)" >> $GITHUB_OUTPUT
        fi

        # if action is deploy or dbt deploy simply set final Deployment id to Deployment id to streamline the deployment id reference in rest of the workflow
        if [[ ${{ inputs.action }} == deploy ]]; then
          echo "FINAL_DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
        fi

        echo ::endgroup::
      shell: bash
      id: deployment-preview
      env:
        BUILD_SECRETS: ${{ inputs.build-secrets }}
        ROOT_FOLDER: ${{ inputs.root-folder }}
        BUNDLE_TRIGGER_PATHS: ${{ inputs.bundle-trigger-paths }}
        MOUNT_PATH: ${{ inputs.mount-path }}
        NON_DAGS_BUNDLE_TYPE: ${{ inputs.non-dags-bundle-type }}
        DAG_BUNDLE_NAME: ${{ inputs.dag-bundle-name }}
        DAGS_PATH: ${{ inputs.dags-path }}
        NO_DAGS_BASE_DIR: ${{ inputs.no-dags-base-dir }}
    - name: Determine if DAG Deploy is enabled
      run: |

        echo ::group::Determine if DAG Deploy is enabled
        if [[ ${{ inputs.action }} != create-deployment-preview && ${{ inputs.action }} != delete-deployment-preview ]]; then
          DAG_DEPLOY_ENABLED=$(astro deployment inspect ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --clean-output --key configuration.dag_deploy_enabled)
          echo "DAG_DEPLOY_ENABLED=${DAG_DEPLOY_ENABLED:-false}" >> $GITHUB_OUTPUT
        else
          echo "DAG_DEPLOY_ENABLED=false" >> $GITHUB_OUTPUT
        fi
        echo ::endgroup::
      shell: bash
      id: dag-deploy-enabled
    - name: Get Bundle Deploy Options
      if: ${{ inputs.deploy-type == 'dbt' || inputs.deploy-type == 'non-dags' }}
      run: |

        echo ::group::Get Bundle Deploy Options

        # the diff below relies on history already present from the fetch-depth: 0 checkout;
        # don't add a `git fetch` here, it fails on private repos due to persist-credentials: false
        BUNDLE_DEPLOY=false
        files=()

        # collect bundle-trigger-paths (comma- or newline-separated), trimmed and non-empty
        BUNDLE_TRIGGERS=()
        while IFS= read -r trigger; do
          trigger="${trigger#"${trigger%%[![:space:]]*}"}"
          trigger="${trigger%"${trigger##*[![:space:]]}"}"
          [[ -n "$trigger" ]] && BUNDLE_TRIGGERS+=("$trigger")
        done <<< "${BUNDLE_TRIGGER_PATHS//,/$'\n'}"

        # case when the triggered event is a manual workflow dispatch or a new branch or tag creation, we would need to deploy the bundle because we cannot determine that it does not need to be deployed
        GITHUB_EVENT_BEFORE=${{ github.event.before }}
        GITHUB_EVENT_AFTER=${{ github.event.after }}
        if [[ "$GITHUB_EVENT_BEFORE" == "0000000000000000000000000000000000000000" || -z $GITHUB_EVENT_BEFORE && -z $GITHUB_EVENT_AFTER ]]; then
          echo "Manual workflow dispatch or a new branch or tag creation, hence missing github event before and/or after commit hash"
          BUNDLE_DEPLOY=true
        elif ! git cat-file -e "$GITHUB_EVENT_BEFORE" 2>/dev/null; then
          echo "Commit $GITHUB_EVENT_BEFORE does not exist, falling back to a bundle deploy."
          BUNDLE_DEPLOY=true
        else
          files=$(git diff --name-only $GITHUB_EVENT_BEFORE $GITHUB_EVENT_AFTER)
          echo "files changed: $files"
        fi

        for file in $files; do
          if [[ $file =~ ^"$ROOT_FOLDER".* ]]; then
            echo $file is part of configured root folder, so would be triggering a bundle deploy
            BUNDLE_DEPLOY=true
          fi

          # changes under any configured bundle-trigger-path also trigger a deploy, even when the
          # file lives outside the bundle directory (e.g. shared macros the bundle depends on)
          for trigger in "${BUNDLE_TRIGGERS[@]}"; do
            if [[ $file == "$trigger"* ]]; then
              echo "$file matches bundle-trigger-path '$trigger', triggering a bundle deploy"
              BUNDLE_DEPLOY=true
            fi
          done
        done

        # skip-unchanged=false disables the diff-based skip entirely and always deploys the bundle
        if [[ "${{ inputs.skip-unchanged }}" == "false" ]]; then
          BUNDLE_DEPLOY=true
        fi

        # a freshly created deployment preview carries no bundle yet, so it always needs one deployed
        if [[ ${{ inputs.action }} == create-deployment-preview ]]; then
          BUNDLE_DEPLOY=true
        fi

        # there is nothing left to deploy to once the preview has been deleted
        if [[ ${{ inputs.action }} == delete-deployment-preview ]]; then
          BUNDLE_DEPLOY=false
        fi

        options=""
        if [[ $BUNDLE_DEPLOY == true ]]; then
          if [[ "${{ inputs.deploy-type }}" == "non-dags" ]]; then
            options="$options --non-dags-mount-path $(printf '%q' "$MOUNT_PATH")"
            if [[ -n "$NON_DAGS_BUNDLE_TYPE" ]]; then
              options="$options --non-dags-bundle-type $(printf '%q' "$NON_DAGS_BUNDLE_TYPE")"
            fi
          elif [[ -n "$MOUNT_PATH" ]]; then
            # Add mount path option
            options="$options --mount-path=$(printf '%q' "$MOUNT_PATH")"
          fi

          # Add description option
          if [[ "${{ inputs.description }}" != "" ]]; then
            options="$options --description '${{ inputs.description }}'"
          fi
        fi

        echo "BUNDLE_DEPLOY=$BUNDLE_DEPLOY" >> $GITHUB_OUTPUT
        echo "BUNDLE_OPTIONS=$options" >> $GITHUB_OUTPUT
        echo ::endgroup::
      shell: bash
      id: bundle-deploy-options
      env:
        ROOT_FOLDER: ${{ inputs.root-folder }}
        BUNDLE_TRIGGER_PATHS: ${{ inputs.bundle-trigger-paths }}
        MOUNT_PATH: ${{ inputs.mount-path }}
        NON_DAGS_BUNDLE_TYPE: ${{ inputs.non-dags-bundle-type }}
    - name: Get Deploy Type
      if: ${{ inputs.deploy-type == 'infer' || inputs.deploy-type == 'dags-only' || inputs.deploy-type == 'image-and-dags' || inputs.deploy-type == 'image-only' }}
      run: |

        # infer based on files changed to deploy only dags or image and dags
        echo ::group::Get Deploy Type

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        DAGS_ONLY_DEPLOY=false
        SKIP_IMAGE_OR_DAGS_DEPLOY=false
        IMAGE_TRIGGER_MATCHED=false
        DIFF_UNAVAILABLE=false
        files=()

        # a changed file counts as a DAG when it sits under the project's dags directory, or under
        # dags-path when the DAGs are served from somewhere else (e.g. one bundle of several in a repo).
        # DAGS_DIR is dags-path in repo-relative form, empty when it is the repo root itself.
        is_dag_file() {
          if [[ -n "$DAGS_PATH" ]]; then
            [[ -z "$DAGS_DIR" || $1 == "$DAGS_DIR/"* ]]
          else
            [[ $1 == *"dags/"* ]]
          fi
        }

        # collect image-trigger-paths (comma- or newline-separated), trimmed and non-empty
        IMAGE_TRIGGER_PATHS="${{ inputs.image-trigger-paths }}"
        IMAGE_TRIGGERS=()
        while IFS= read -r trigger; do
          trigger="${trigger#"${trigger%%[![:space:]]*}"}"
          trigger="${trigger%"${trigger##*[![:space:]]}"}"
          [[ -n "$trigger" ]] && IMAGE_TRIGGERS+=("$trigger")
        done <<< "${IMAGE_TRIGGER_PATHS//,/$'\n'}"

        GITHUB_EVENT_BEFORE=${{ github.event.before }}
        GITHUB_EVENT_AFTER=${{ github.event.after }}
        # case when the triggered event is a manual workflow dispatch or a new branch or tag creation, we cannot tell what changed, so we deploy everything deploy-type covers
        if [[ "$GITHUB_EVENT_BEFORE" == "0000000000000000000000000000000000000000" ||  -z $GITHUB_EVENT_BEFORE && -z $GITHUB_EVENT_AFTER ]]; then
          echo "Manual workflow dispatch or a new branch or tag creation, hence missing github event before and/or after commit hash"
          DIFF_UNAVAILABLE=true
        else
          echo "event that triggered the workflow: $GITHUB_REF"
          # history is already present from the fetch-depth: 0 checkout, so no fetch is needed;
          # a `git fetch` here would also fail on private repos due to persist-credentials: false
          if ! git cat-file -e "$GITHUB_EVENT_BEFORE" 2>/dev/null; then
            echo "Commit $GITHUB_EVENT_BEFORE does not exist, so the changed files can't be determined; deploying everything deploy-type covers."
            DIFF_UNAVAILABLE=true
          else
            SKIP_IMAGE_OR_DAGS_DEPLOY=true
            files=$(git diff --name-only $GITHUB_EVENT_BEFORE $GITHUB_EVENT_AFTER)
            echo "files changed: $files"
          fi
        fi

        for file in $files; do
          # changes under any configured image-trigger-path force a full image deploy, even when
          # the file lives outside root-folder (e.g. generated protos baked into the image at build time)
          for trigger in "${IMAGE_TRIGGERS[@]}"; do
            if [[ $file == "$trigger"* ]]; then
              echo "$file matches image-trigger-path '$trigger', forcing an image deploy"
              IMAGE_TRIGGER_MATCHED=true
            fi
          done

          # dags-path may sit outside root-folder (DAGs deployed independently of the Astro project)
          if [[ $file =~ ^"${{ inputs.root-folder }}".* ]] || { [[ -n "$DAGS_PATH" ]] && is_dag_file "$file"; }; then
            echo $file is part of the input root folder or dags-path
            SKIP_IMAGE_OR_DAGS_DEPLOY=false
            if [[ ${{ inputs.deploy-type }} == 'infer' ]]; then
              if is_dag_file "$file"; then
                echo $file is part of dags folder
                DAGS_ONLY_DEPLOY=true
              else
                DAGS_ONLY_DEPLOY=false
                break
              fi
            elif [[ ${{ inputs.deploy-type }} == 'dags-only' ]]; then
              if is_dag_file "$file"; then
                echo $file is part of dags folder
                DAGS_ONLY_DEPLOY=true
              fi
            elif [[ ${{ inputs.deploy-type }} == 'image-and-dags' ]]; then
              DAGS_ONLY_DEPLOY=false
              break
            elif [[ ${{ inputs.deploy-type }} == 'image-only' ]]; then
              DAGS_ONLY_DEPLOY=false
              break
            fi
          fi
        done

        # Note: the order of these following checks is important to ensure that we skip/trigger deploy correctly in following cases:
        # 1. When there is no change in the input root folder we should skip deploy, but not when it's deployment preview create action
        # 2. When user has passed a custom image then we would need to deploy the image
        # 3. When the action is deployment preview delete, then we should skip any form of deploy
        if [[ $SKIP_IMAGE_OR_DAGS_DEPLOY == true ]]; then
          # skip all deploy steps
          DAGS_ONLY_DEPLOY=false
        fi

        # check if user has passed a custom image or the action has created a new deployment preview, then we would need to deploy the image
        if [[ ${{ inputs.image-name }} != "no-custom-image" || "${{ steps.dag-deploy-enabled.outputs.DAG_DEPLOY_ENABLED }}" == "false" || ${{ inputs.action }} == create-deployment-preview ]]; then
          SKIP_IMAGE_OR_DAGS_DEPLOY=false
          DAGS_ONLY_DEPLOY=false
        fi

        # a new preview has no DAGs yet, so a dags-only step deploys its DAGs there, as bundle steps do
        if [[ ${{ inputs.action }} == create-deployment-preview && ${{ inputs.deploy-type }} == 'dags-only' ]]; then
          if [[ "$(astro deployment inspect ${{ steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID }} --clean-output --key configuration.dag_deploy_enabled)" == "true" ]]; then
            DAGS_ONLY_DEPLOY=true
          fi
        fi

        # with no diff to go on, a dags-only step deploys its DAGs, as the other deploy types deploy everything
        if [[ $DIFF_UNAVAILABLE == true && ${{ inputs.deploy-type }} == 'dags-only' && "${{ steps.dag-deploy-enabled.outputs.DAG_DEPLOY_ENABLED }}" == "true" ]]; then
          DAGS_ONLY_DEPLOY=true
        fi

        # a change under image-trigger-paths forces a full image deploy, even if nothing under root-folder changed
        if [[ $IMAGE_TRIGGER_MATCHED == true ]]; then
          SKIP_IMAGE_OR_DAGS_DEPLOY=false
          DAGS_ONLY_DEPLOY=false
        fi

        # skip-unchanged=false disables the diff-based skip entirely and always honors deploy-type
        if [[ "${{ inputs.skip-unchanged }}" == "false" ]]; then
          SKIP_IMAGE_OR_DAGS_DEPLOY=false
          # for dags-only, ensure the dag deploy runs even when nothing under root-folder changed;
          # other deploy types keep their already-inferred image/dags decision
          if [[ ${{ inputs.deploy-type }} == 'dags-only' ]]; then
            DAGS_ONLY_DEPLOY=true
          fi
        fi

        if [[ ${{ inputs.action }} == delete-deployment-preview ]]; then
          # skip all deploy steps
          SKIP_IMAGE_OR_DAGS_DEPLOY=true
          DAGS_ONLY_DEPLOY=false
        fi

        IMAGE_ONLY_DEPLOY=false
        if [[ ${{ inputs.deploy-type }} == 'image-only' && $SKIP_IMAGE_OR_DAGS_DEPLOY == false ]]; then
          IMAGE_ONLY_DEPLOY=true
        fi

        echo "DAGS_ONLY_DEPLOY=$DAGS_ONLY_DEPLOY" >> $GITHUB_OUTPUT
        echo "SKIP_IMAGE_OR_DAGS_DEPLOY=$SKIP_IMAGE_OR_DAGS_DEPLOY" >> $GITHUB_OUTPUT
        echo "IMAGE_ONLY_DEPLOY=$IMAGE_ONLY_DEPLOY" >> $GITHUB_OUTPUT
        echo ::endgroup::
      shell: bash
      id: deploy-type
      env:
        ROOT_FOLDER: ${{ inputs.root-folder }}
        DAGS_PATH: ${{ inputs.dags-path }}
        DAGS_DIR: ${{ steps.deployment-preview.outputs.DAGS_DIR }}
    # If only DAGs changed and dag deploys is enabled, do a DAG-only deploy
    - name: Setup image or dags deploy options
      if: ${{ inputs.deploy-type == 'infer' || inputs.deploy-type == 'dags-only' || inputs.deploy-type == 'image-and-dags' || inputs.deploy-type == 'image-only' }}
      run: |

        echo ::group::Setup image or dags deploy options
        options=""

        # add parse option (not applicable for image-only deploys)
        if [[ ${{ inputs.parse }} == true && ${{ inputs.deploy-type }} != "image-only" ]]; then
          options="--parse"
        fi

        # add pytest option (not applicable for image-only deploys)
        if [[ ${{ inputs.pytest }} == true && ${{ inputs.deploy-type }} != "image-only" ]]; then
          options="$options --pytest --test ${{ inputs.pytest-file }}"
        fi

        # add custom image option
        if [[ ${{ inputs.image-name }} != no-custom-image && ${{ inputs.deploy-type }} != "dags-only" ]]; then
          options="$options --image-name ${{ inputs.image-name }}"
        fi

        # add force option
        if [[ ${{ inputs.force }} == true ]]; then
          options="$options --force"
        fi

        # Add description option
        if [[ "${{ inputs.description }}" != '' ]]; then
          options="$options --description '${{ inputs.description }}'"
        fi

        # add build secret option(s)
        if [[ -n "$BUILD_SECRETS" ]]; then
          secrets=()
          while IFS= read -r secret; do
            if [[ -n "$secret" ]]; then
              secrets+=("$secret")
            fi
          done <<< "$BUILD_SECRETS"

          CLI_VERSION=""
          if command -v astro &> /dev/null; then
            CLI_VERSION=$(astro version | awk '{print $4}')
          fi

          # `--build-secrets` was added in v1.44.0.
          #
          # If we're running a version earlier than that, use `--build-secrets`,
          # and only support a single entry.
          BUILD_SECRET_MULTI=true
          if [[ -n "$CLI_VERSION" ]] && command -v semver >/dev/null 2>&1 && ! semver -r ">=1.44.0" "$CLI_VERSION" >/dev/null 2>&1; then
            BUILD_SECRET_MULTI=false
          fi

          if [[ ${#secrets[@]} -gt 0 && $BUILD_SECRET_MULTI == false ]]; then
            if [[ ${#secrets[@]} -gt 1 ]]; then
              echo "::warning::This version of the Astro CLI accepts only a single build secret: only the first line in 'build-secrets' will be used. Set cli-version to 1.44.0 or later to use multiple build secrets."
            fi
            options="$options --build-secrets '${secrets[0]}'"
          else
            for secret in "${secrets[@]}"; do
              options="$options --build-secret '$secret'"
            done
          fi
        fi

        # the DAG options below are meaningless for an image-only deploy, which leaves DAGs untouched
        if [[ ${{ inputs.deploy-type }} != "image-only" ]]; then
          # add named DAG bundle option
          if [[ -n "$DAG_BUNDLE_NAME" ]]; then
            options="$options --dag-bundle-name $(printf '%q' "$DAG_BUNDLE_NAME")"
          fi

          # add custom dags path option
          if [[ -n "$DAGS_PATH" ]]; then
            options="$options --dags-path $(printf '%q' "$DAGS_PATH")"
          fi

          # add no dags base dir option
          if [[ "$NO_DAGS_BASE_DIR" == true ]]; then
            options="$options --no-dags-base-dir"
          fi
        fi

        echo "OPTIONS=$options" >> $GITHUB_OUTPUT
        echo ::endgroup::
      shell: bash
      id: deploy-options
      env:
        BUILD_SECRETS: ${{ inputs.build-secrets }}
        DAG_BUNDLE_NAME: ${{ inputs.dag-bundle-name }}
        DAGS_PATH: ${{ inputs.dags-path }}
        NO_DAGS_BASE_DIR: ${{ inputs.no-dags-base-dir }}
    - name: Determine if Development Mode is enabled
      if: ${{ inputs.wake-on-deploy == 'true' && inputs.action != 'delete-deployment-preview' }}
      run: |
        echo ::group::Determine if Development Mode is enabled
        DEPLOYMENT_TYPE=$(astro deployment inspect ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --clean-output --key configuration.deployment_type)
        # only inspect development mode if deployment is not hybrid
        if [[ $DEPLOYMENT_TYPE != "HYBRID" ]]; then
          DEV_MODE=$(astro deployment inspect ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --clean-output --key configuration.is_development_mode)
          echo "Deployment development mode: $DEV_MODE"
          if [[ $DEV_MODE == "" ]]; then
            echo "DEVELOPMENT_MODE=false" >> $GITHUB_OUTPUT
          else
            echo "DEVELOPMENT_MODE=$DEV_MODE" >> $GITHUB_OUTPUT
          fi
        else
          echo "DEVELOPMENT_MODE=false" >> $GITHUB_OUTPUT
        fi
        echo ::endgroup::
      shell: bash
      id: development-mode
    - name: Override to wake up the Deployment
      if: ${{ inputs.wake-on-deploy == 'true' && inputs.action != 'delete-deployment-preview' && steps.development-mode.outputs.DEVELOPMENT_MODE == 'true' }}
      run: |
        echo ::group::Override to wake up the Deployment
        astro deployment wake-up ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --force
        # Wait for the deployment to wake up
        while [ "$(astro deployment inspect ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --clean-output --key metadata.status)" == "HIBERNATING" ]
        do
          sleep 5
        done
        echo ::endgroup::
      shell: bash
    - name: DAG Deploy to Astro
      if: ${{ (inputs.deploy-type == 'dags-only' || inputs.deploy-type == 'infer') && steps.deploy-type.outputs.DAGS_ONLY_DEPLOY == 'true' }}
      run: |

        echo ::group::DAG Deploy to Astro
        # Deploy only dags

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        if [[ "${{ inputs.wait-time }}" != "" ]]; then
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait --dags ${{steps.deploy-options.outputs.OPTIONS}} --wait-time "${{ inputs.wait-time }}"
        else
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait --dags ${{steps.deploy-options.outputs.OPTIONS}}
        fi
        echo ::endgroup::
      shell: bash
    # If any other files changed or dag deploys is disabled, deploy the entire Astro project
    - name: Image and DAG Deploy to Astro
      if: ${{ inputs.deploy-image == true || ( (inputs.deploy-type == 'image-and-dags' || inputs.deploy-type == 'infer') && steps.deploy-type.outputs.DAGS_ONLY_DEPLOY == 'false' && steps.deploy-type.outputs.SKIP_IMAGE_OR_DAGS_DEPLOY == 'false' ) }}
      run: |
        echo ::group::Image and DAG Deploy to Astro
        # Deploy image and DAGs

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        if [[ "${{ inputs.wait-time }}" != "" ]]; then
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait ${{steps.deploy-options.outputs.OPTIONS}} --wait-time "${{ inputs.wait-time }}"
        else
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait ${{steps.deploy-options.outputs.OPTIONS}}
        fi
        echo ::endgroup::
      shell: bash
    - name: Image Only Deploy to Astro
      if: ${{ inputs.deploy-type == 'image-only' && steps.deploy-type.outputs.IMAGE_ONLY_DEPLOY == 'true' }}
      run: |
        echo ::group::Image Only Deploy to Astro
        # Deploy image only, leaving existing DAGs untouched

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        if [[ "${{ inputs.wait-time }}" != "" ]]; then
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait --image ${{steps.deploy-options.outputs.OPTIONS}} --wait-time "${{ inputs.wait-time }}"
        else
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait --image ${{steps.deploy-options.outputs.OPTIONS}}
        fi
        echo ::endgroup::
      shell: bash
    - name: DBT Deploy to Astro
      if: ${{ inputs.deploy-type == 'dbt' && steps.bundle-deploy-options.outputs.BUNDLE_DEPLOY == 'true' }}
      run: |

        echo ::group::DBT Deploy to Astro

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        if [[ "${{ inputs.wait-time }}" != "" ]]; then
          astro dbt deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait ${{steps.bundle-deploy-options.outputs.BUNDLE_OPTIONS}} --wait-time "${{ inputs.wait-time }}"
        else
          astro dbt deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --wait ${{steps.bundle-deploy-options.outputs.BUNDLE_OPTIONS}}
        fi
        echo ::endgroup::
      shell: bash
    - name: Non-DAG Bundle Deploy to Astro
      if: ${{ inputs.deploy-type == 'non-dags' && steps.bundle-deploy-options.outputs.BUNDLE_DEPLOY == 'true' }}
      run: |

        echo ::group::Non-DAG Bundle Deploy to Astro
        # Deploy root-folder as a non-DAG bundle, mounted for reference by DAGs.

        if [[ "${{ inputs.root-folder }}" != "" ]]; then
          cd ${{ inputs.root-folder }}
        fi

        if [[ "${{ inputs.wait-time }}" != "" ]]; then
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --non-dags --wait ${{steps.bundle-deploy-options.outputs.BUNDLE_OPTIONS}} --wait-time "${{ inputs.wait-time }}"
        else
          astro deploy ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --non-dags --wait ${{steps.bundle-deploy-options.outputs.BUNDLE_OPTIONS}}
        fi
        echo ::endgroup::
      shell: bash
    - name: Copy Airflow Connections, Variables, and Pools
      if: ${{ inputs.action == 'create-deployment-preview' }}
      run: |

        echo ::group::Copy Airflow Connections, Variables, and Pools
        if [[ ${{ inputs.copy-connections }} == true ]]; then
          astro deployment connection copy --source-id ${{steps.deployment-preview.outputs.ORIGINAL_DEPLOYMENT_ID}}  --target-id ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}}
        fi
        if [[ ${{ inputs.copy-airflow-variables }} == true ]]; then
          astro deployment airflow-variable copy --source-id ${{steps.deployment-preview.outputs.ORIGINAL_DEPLOYMENT_ID}} --target-id ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}}
        fi
        if [[ ${{ inputs.copy-pools }} == true ]]; then
          astro deployment pool copy --source-id ${{steps.deployment-preview.outputs.ORIGINAL_DEPLOYMENT_ID}} --target-id ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}}
        fi
        echo ::endgroup::
      shell: bash
    - name: Remove override on Deployment to resume schedule
      if: ${{ inputs.wake-on-deploy == 'true' && inputs.action != 'delete-deployment-preview' && steps.development-mode.outputs.DEVELOPMENT_MODE == 'true' }}
      run: |
        echo ::group::Remove override on Deployment to resume schedule
        astro deployment wake-up ${{steps.deployment-preview.outputs.FINAL_DEPLOYMENT_ID}} --remove-override --force
        echo ::endgroup::
      shell: bash
