name: E2E Tests for Astro Deploy Action

on:
  push:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Astro CLI version to pre-install via setup-astro-cli (e.g. 1.38.0). Leave blank for latest."
        required: false
        default: ""

env:
  ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
  # The diff base the action reads, normalized by .github/workflows/e2e/patch_action_for_dispatch.
  # A real push carries usable SHAs; workflow_dispatch carries none, and a push that creates the
  # branch reports an all-zero before. The action treats both of those as "cannot diff, deploy
  # everything", which is right in production but defeats every test that asserts a narrower deploy
  # or a skip — so they are replaced with sentinels that get past that guard and let the git mocks
  # decide. The sentinels need not be valid SHAs: git is mocked wherever the decision matters.
  DEPLOY_ACTION_DIFF_BEFORE: ${{ (github.event.before && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || 'e2e-fake-before' }}
  DEPLOY_ACTION_DIFF_AFTER: ${{ (github.event.after && github.event.after != '0000000000000000000000000000000000000000') && github.event.after || 'e2e-fake-after' }}

jobs:
  redact-inputs:
    name: Redact Inputs
    runs-on: ubuntu-latest
    environment: e2e-test
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Redact Inputs
        run: |

          # add-mask will redact the value of the input, but will still log the value,
          # hence using a known workaround: https://github.com/actions/runner/issues/643
          WORKSPACE_ID=$(jq -r '.inputs.workspace_id' $GITHUB_EVENT_PATH)
          echo ::add-mask::$WORKSPACE_ID
          ORG_ID=$(jq -r '.inputs.org_id' $GITHUB_EVENT_PATH)
          echo ::add-mask::$ORG_ID
          ASTRONOMER_HOST=$(jq -r '.inputs.astronomer_host' $GITHUB_EVENT_PATH)
          echo ::add-mask::$ASTRONOMER_HOST
          TOKEN=$(jq -r '.inputs.token' $GITHUB_EVENT_PATH)
          echo ::add-mask::$TOKEN

  # Tests that deploy compare a deployment's versions (and, with wake-on-deploy, its hibernation spec)
  # before and after, so no two may run against one deployment at once. They are split into chains
  # that run in parallel, each on its own deployment and each about as long as the preview test:
  #   a: default (dags) -> infer (dags) -> custom image
  #   b: default (image-and-dags) -> infer (image-and-dags) -> image only
  #   c: pytest -> dag deploy -> no deploy -> dbt (no deploy asserts no dbt bundle yet, so it precedes dbt)
  # once per kind (standard, hibernate), plus one deployment each for the preview, bundle and remote tests.
  # A job later in a chain waits on the earlier one only to take turns, not on its result.
  # DEPLOYMENTS maps each slot name to its deployment ID; test jobs look theirs up by slot.
  create-test-deployments:
    name: Create Deployments
    needs: redact-inputs
    runs-on: ubuntu-latest
    outputs:
      DEPLOYMENTS: ${{ steps.create-deployments.outputs.DEPLOYMENTS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Patch deploy-action for manual dispatch
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Astro Environment Info
        id: get-astro-env-info
        uses: ./.github/workflows/e2e/get_astro_env_info
        with:
          input_workspace_id: ${{ github.event.inputs.workspace_id }}
          input_organization_id: ${{ github.event.inputs.org_id }}
          input_astronomer_host: ${{ github.event.inputs.astronomer_host }}
          input_astro_api_token: ${{ github.event.inputs.token }}
          secret_workspace_id: ${{ secrets.WORKSPACE_ID }}
          secret_organization_id: ${{ secrets.ORGANIZATION_ID }}
          secret_astronomer_host: ${{ secrets.ASTRONOMER_HOST }}
          secret_astro_api_token: ${{ secrets.ASTRO_API_TOKEN }}

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: ${{ github.event.inputs.cli_version }}

      - name: Install dependencies
        run: |

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O "$HOME/.local/bin/yq" && chmod +x "$HOME/.local/bin/yq"
          astro context switch ${{ steps.get-astro-env-info.outputs.astronomer_host }}
          astro workspace switch ${{ steps.get-astro-env-info.outputs.workspace_id }}

      - name: Create Deployments
        id: create-deployments
        env:
          REMOTE_CLUSTER_NAME: ${{ secrets.REMOTE_EXECUTION_CLUSTER_NAME }}
        run: |

          if [[ -z "$REMOTE_CLUSTER_NAME" ]]; then
            echo "::error::REMOTE_EXECUTION_CLUSTER_NAME secret is not set on the e2e-test environment. Add the dedicated cluster's name to enable remote-execution e2e tests."
            exit 1
          fi

          # slot:template; slot names must match the lookups in the test jobs
          slots=()
          for kind in standard hibernate; do
            template=$([[ $kind == hibernate ]] && echo deployment-hibernate.yaml || echo deployment.yaml)
            for slot in $kind-a $kind-b $kind-c preview-$kind; do
              slots+=("$slot:$template")
            done
          done
          slots+=(bundle:deployment-bundle.yaml remote:deployment-remote.yaml)

          # short random id keeps names unique across runs while staying within the name length limit
          test_uid=$(uuidgen | cut -c1-8)
          out="$RUNNER_TEMP/deployments"
          mkdir -p "$out"

          create() {
            local slot=$1 file="$out/$1.yaml" name="e2e-$test_uid-$1"
            cp "e2e-setup/deployment-templates/$2" "$file"
            sed -i "s|REMOTE_EXECUTION_CLUSTER_NAME_PLACEHOLDER|$REMOTE_CLUSTER_NAME|g; s|  name:.*|  name: $name|" "$file"
            local attempt created id
            for attempt in 1 2 3 4 5; do
              if created=$(astro deployment create --deployment-file "$file" 2> "$out/$slot.err"); then
                yq e '.deployment.metadata.deployment_id' - <<< "$created" > "$out/$slot.id"
                return 0
              fi
              # a failed create, even a rate-limited one (429), may have created the deployment anyway,
              # so look it up by name to record its ID for the tests and cleanup instead of creating a duplicate
              sleep $(( attempt * 10 ))
              if id=$(astro deployment inspect --clean-output -n "$name" --key metadata.deployment_id < /dev/null 2> /dev/null) && [[ -n "$id" ]]; then
                echo "Creating $slot failed, but the deployment exists"
                echo "$id" > "$out/$slot.id"
                return 0
              fi
              # retry rate limits, and duplicate names left by a create whose lookup above was itself rate-limited
              if ! grep -qE 'status 429|already exists' "$out/$slot.err"; then
                break
              fi
              echo "Creating $slot failed, retrying (attempt $attempt): $(head -1 "$out/$slot.err")"
            done
            cat "$out/$slot.err" >&2
            return 1
          }

          # creates return once the request is accepted, so running them one by one costs little
          for entry in "${slots[@]}"; do
            create "${entry%%:*}" "${entry#*:}" || true
          done

          # publish whatever was created before failing, so delete-test-deployments can clean it up
          deployments='{}'
          missing=()
          for entry in "${slots[@]}"; do
            slot=${entry%%:*}
            id=$(cat "$out/$slot.id" 2>/dev/null || true)
            if [[ -n "$id" && "$id" != null ]]; then
              deployments=$(jq -c --arg slot "$slot" --arg id "$id" '. + {($slot): $id}' <<< "$deployments")
            else
              missing+=("$slot")
            fi
          done
          echo "DEPLOYMENTS=$deployments" >> $GITHUB_OUTPUT

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Failed to create deployments for: ${missing[*]}"
            exit 1
          fi
  default-deploy-tests:
    name: Default Deploy Test
    runs-on: ubuntu-latest
    needs: [create-test-deployments]
    strategy:
      fail-fast: false
      matrix:
        deployment: [standard, hibernate]
        deploy_type: [dags, image-and-dags]
    env:
      E2E_DEPLOYMENT_ID: ${{ fromJSON(needs.create-test-deployments.outputs.DEPLOYMENTS)[format('{0}-{1}', matrix.deployment, matrix.deploy_type == 'dags' && 'a' || 'b')] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Patch deploy-action for manual dispatch
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Astro Environment Info
        id: get-astro-env-info
        uses: ./.github/workflows/e2e/get_astro_env_info
        with:
          input_workspace_id: ${{ github.event.inputs.workspace_id }}
          input_organization_id: ${{ github.event.inputs.org_id }}
          input_astronomer_host: ${{ github.event.inputs.astronomer_host }}
          input_astro_api_token: ${{ github.event.inputs.token }}
          secret_workspace_id: ${{ secrets.WORKSPACE_ID }}
          secret_organization_id: ${{ secrets.ORGANIZATION_ID }}
          secret_astronomer_host: ${{ secrets.ASTRONOMER_HOST }}
          secret_astro_api_token: ${{ secrets.ASTRO_API_TOKEN }}

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: ${{ github.event.inputs.cli_version }}

      - name: Install dependencies
        run: sudo apt-get install jq

      - name: Mock git commands
        run: |

          # if deploy_type is dags, then use dags-deploy-git.sh as mock otherwise use image-deploy-git.sh as mock
          if [[ "${{ matrix.deploy_type }}" == "dags" ]]; then
            mv e2e-setup/mocks/dag-deploy-git.sh /usr/local/bin/git
          else
            mv e2e-setup/mocks/image-deploy-git.sh /usr/local/bin/git
          fi
          chmod +x /usr/local/bin/git

          # Stash the real astro at the path the astro-deploy.sh mock expects, then
          # shadow `astro` on PATH with the mock by placing it earlier in PATH.
          mkdir -p "$HOME/.local/bin"
          cp "$(command -v astro)" "$HOME/.local/bin/astro-original"
          mv e2e-setup/mocks/astro-deploy.sh "$HOME/.local/bin/astro"
          chmod +x "$HOME/.local/bin/astro"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set CLI context
        run: astro context switch ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Get Deployment Info Before Test
        id: get-deployment-before
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Run Deploy Action
        uses: ./
        with:
          deployment-id: ${{ env.E2E_DEPLOYMENT_ID }}
          workspace: ${{ steps.get-astro-env-info.outputs.workspace_id }}
          wake-on-deploy: ${{ matrix.deployment == 'hibernate' }}
          wait-time: 15m

      - name: Get Deployment Info After Test
        id: get-deployment-after
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Validate Deploy Action
        uses: ./.github/workflows/e2e/validate_deployment
        with:
          is_wake_on_deploy: ${{ matrix.deployment == 'hibernate' }}
          is_dag_only_deploy: ${{ matrix.deploy_type == 'dags' }}
          dag_tarball_version_before: ${{ steps.get-deployment-before.outputs.desired_dag_tarball_version }}
          image_version_before: ${{ steps.get-deployment-before.outputs.desired_image_version }}
          hibernation_spec_before: ${{ steps.get-deployment-before.outputs.hibernation_spec }}
          dag_tarball_version_after: ${{ steps.get-deployment-after.outputs.desired_dag_tarball_version }}
          image_version_after: ${{ steps.get-deployment-after.outputs.desired_image_version }}
          hibernation_spec_after: ${{ steps.get-deployment-after.outputs.hibernation_spec }}

  # DAG Deploy test would test the DAG only deploy functionality in deploy action
  dag-deploy-test:
    name: DAG Deploy Test
    runs-on: ubuntu-latest
    needs: [pytests-test, create-test-deployments]
    if: ${{ !cancelled() && needs.create-test-deployments.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        deployment: [standard, hibernate]
    env:
      E2E_DEPLOYMENT_ID: ${{ fromJSON(needs.create-test-deployments.outputs.DEPLOYMENTS)[format('{0}-c', matrix.deployment)] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Patch deploy-action for manual dispatch
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Astro Environment Info
        id: get-astro-env-info
        uses: ./.github/workflows/e2e/get_astro_env_info
        with:
          input_workspace_id: ${{ github.event.inputs.workspace_id }}
          input_organization_id: ${{ github.event.inputs.org_id }}
          input_astronomer_host: ${{ github.event.inputs.astronomer_host }}
          input_astro_api_token: ${{ github.event.inputs.token }}
          secret_workspace_id: ${{ secrets.WORKSPACE_ID }}
          secret_organization_id: ${{ secrets.ORGANIZATION_ID }}
          secret_astronomer_host: ${{ secrets.ASTRONOMER_HOST }}
          secret_astro_api_token: ${{ secrets.ASTRO_API_TOKEN }}

      - name: Mock git commands
        run: |
          mv e2e-setup/mocks/dag-deploy-git.sh /usr/local/bin/git
          chmod +x /usr/local/bin/git

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: ${{ github.event.inputs.cli_version }}

      - name: Install dependencies
        run: sudo apt-get install jq

      - name: Set CLI context
        run: astro context switch ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Get Deployment Info Before Test
        id: get-deployment-before
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Deploy to Astro
        uses: ./
        with:
          deployment-id: ${{ env.E2E_DEPLOYMENT_ID }}
          workspace: ${{ steps.get-astro-env-info.outputs.workspace_id }}
          parse: true
          root-folder: e2e-setup/astro-project
          wake-on-deploy: ${{ matrix.deployment == 'hibernate' }}
          wait-time: 15m

      - name: Get Deployment Info After Test
        id: get-deployment-after
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Validate Deploy Action
        uses: ./.github/workflows/e2e/validate_deployment
        with:
          is_wake_on_deploy: ${{ matrix.deployment == 'hibernate' }}
          is_dag_only_deploy: true
          dag_tarball_version_before: ${{ steps.get-deployment-before.outputs.desired_dag_tarball_version }}
          image_version_before: ${{ steps.get-deployment-before.outputs.desired_image_version }}
          hibernation_spec_before: ${{ steps.get-deployment-before.outputs.hibernation_spec }}
          dag_tarball_version_after: ${{ steps.get-deployment-after.outputs.desired_dag_tarball_version }}
          image_version_after: ${{ steps.get-deployment-after.outputs.desired_image_version }}
          hibernation_spec_after: ${{ steps.get-deployment-after.outputs.hibernation_spec }}

      - name: Re-patch deploy-action before the dispatch invocation
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Deployment Info Before A Workflow Dispatch
        id: get-deployment-before-dispatch
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      # a workflow_dispatch has no diff, so a dags-only deploy must deploy the DAGs rather than skip
      - name: Deploy DAGs a Workflow Dispatch
        uses: ./
        env:
          DEPLOY_ACTION_DIFF_BEFORE: ""
          DEPLOY_ACTION_DIFF_AFTER: ""
        with:
          deployment-id: ${{ env.E2E_DEPLOYMENT_ID }}
          workspace: ${{ steps.get-astro-env-info.outputs.workspace_id }}
          deploy-type: dags-only
          root-folder: e2e-setup/astro-project
          wake-on-deploy: ${{ matrix.deployment == 'hibernate' }}
          wait-time: 15m

      - name: Get Deployment Info After A Workflow Dispatch
        id: get-deployment-after-dispatch
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Validate A Workflow Dispatch deployed only DAGs
        uses: ./.github/workflows/e2e/validate_deployment
        with:
          is_wake_on_deploy: ${{ matrix.deployment == 'hibernate' }}
          is_dag_only_deploy: true
          dag_tarball_version_before: ${{ steps.get-deployment-before-dispatch.outputs.desired_dag_tarball_version }}
          image_version_before: ${{ steps.get-deployment-before-dispatch.outputs.desired_image_version }}
          hibernation_spec_before: ${{ steps.get-deployment-before-dispatch.outputs.hibernation_spec }}
          dag_tarball_version_after: ${{ steps.get-deployment-after-dispatch.outputs.desired_dag_tarball_version }}
          image_version_after: ${{ steps.get-deployment-after-dispatch.outputs.desired_image_version }}
          hibernation_spec_after: ${{ steps.get-deployment-after-dispatch.outputs.hibernation_spec }}

  pytests-test:
    name: Pytest Test
    runs-on: ubuntu-latest
    needs: [create-test-deployments]
    strategy:
      fail-fast: false
      matrix:
        deployment: [standard, hibernate]
    env:
      E2E_DEPLOYMENT_ID: ${{ fromJSON(needs.create-test-deployments.outputs.DEPLOYMENTS)[format('{0}-c', matrix.deployment)] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Patch deploy-action for manual dispatch
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Astro Environment Info
        id: get-astro-env-info
        uses: ./.github/workflows/e2e/get_astro_env_info
        with:
          input_workspace_id: ${{ github.event.inputs.workspace_id }}
          input_organization_id: ${{ github.event.inputs.org_id }}
          input_astronomer_host: ${{ github.event.inputs.astronomer_host }}
          input_astro_api_token: ${{ github.event.inputs.token }}
          secret_workspace_id: ${{ secrets.WORKSPACE_ID }}
          secret_organization_id: ${{ secrets.ORGANIZATION_ID }}
          secret_astronomer_host: ${{ secrets.ASTRONOMER_HOST }}
          secret_astro_api_token: ${{ secrets.ASTRO_API_TOKEN }}

      - name: Install Astro CLI
        uses: astronomer/setup-astro-cli@v0.0.1
        with:
          version: ${{ github.event.inputs.cli_version }}

      - name: Install dependencies
        run: sudo apt-get install jq

      - name: Set CLI context
        run: astro context switch ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Mock git commands for DAG Deploy
        run: |

          # set to dag deploy git mock, with deploy-type set to image-and-dags to test that it will do a image deploy
          mv e2e-setup/mocks/dag-deploy-git.sh /usr/local/bin/git
          chmod +x /usr/local/bin/git

      - name: Get Deployment Info Before Test
        id: get-deployment-before
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Run Pytest
        uses: ./
        with:
          deployment-id: ${{ env.E2E_DEPLOYMENT_ID }}
          workspace: ${{ steps.get-astro-env-info.outputs.workspace_id }}
          pytest: true
          action: deploy
          deploy-type: image-and-dags
          root-folder: e2e-setup/astro-project
          wake-on-deploy: ${{ matrix.deployment == 'hibernate' }}
          wait-time: 15m

      - name: Get Deployment Info After Test
        id: get-deployment-after
        uses: ./.github/workflows/e2e/get_deployment_info
        with:
          deployment_id: ${{ env.E2E_DEPLOYMENT_ID }}
          organization_id: ${{ steps.get-astro-env-info.outputs.organization_id }}
          astro_api_token: ${{ steps.get-astro-env-info.outputs.astro_api_token }}
          astronomer_host: ${{ steps.get-astro-env-info.outputs.astronomer_host }}

      - name: Validate Deploy Action
        uses: ./.github/workflows/e2e/validate_deployment
        with:
          is_wake_on_deploy: ${{ matrix.deployment == 'hibernate' }}
          dag_tarball_version_before: ${{ steps.get-deployment-before.outputs.desired_dag_tarball_version }}
          image_version_before: ${{ steps.get-deployment-before.outputs.desired_image_version }}
          hibernation_spec_before: ${{ steps.get-deployment-before.outputs.hibernation_spec }}
          dag_tarball_version_after: ${{ steps.get-deployment-after.outputs.desired_dag_tarball_version }}
          image_version_after: ${{ steps.get-deployment-after.outputs.desired_image_version }}
          hibernation_spec_after: ${{ steps.get-deployment-after.outputs.hibernation_spec }}

  infer-deploy:
    name: Infer Deploy Test
    runs-on: ubuntu-latest
    needs: [default-deploy-tests, create-test-deployments]
    if: ${{ !cancelled() && needs.create-test-deployments.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        deployment: [standard, hibernate]
        deploy_type: [dags, image-and-dags]
    env:
      E2E_DEPLOYMENT_ID: ${{ fromJSON(needs.create-test-deployments.outputs.DEPLOYMENTS)[format('{0}-{1}', matrix.deployment, matrix.deploy_type == 'dags' && 'a' || 'b')] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Patch deploy-action for manual dispatch
        uses: ./.github/workflows/e2e/patch_action_for_dispatch

      - name: Get Astro Environment Info
        id: get-astro-env-info
        uses: ./.github/workflows/e2e/get_astro_env_info
        with:
          input_workspace_id: ${{ github.event.inputs.workspace_id }}
          input_organization_id: ${{ github.event.inputs.org_id }}
          input_astronomer_host: ${{ github.event.inputs.astronomer_host }}
          input_astro_api_token: ${{ github.event.inputs.token }}
          secret_workspace_id: ${{ secrets.WORKSPACE_ID }}
          secret_organization_id: ${{ secrets.ORGANIZATION_ID }}
          secret_astronomer_host: ${{ secrets.ASTRONOMER_HOST }}
          secret_astro_api_token: ${{ secrets.ASTRO_API_TOKEN }}

